		body { font-family: 'Inter', sans-serif; background: #0A0C0F; color: #E0E4E9; margin:0; }
		.container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
		.header { padding: 16px 0; background: rgba(10,12,15,0.8); border-bottom: 1px solid rgba(93,155,255,0.1); position: sticky; top:0 }
		.header .container { display:flex; justify-content:space-between; align-items:center }
		.logo { color:#fff; font-weight:700; text-decoration:none }
		.nav { display:flex; gap:24px }
		.nav a { color:#E0E4E9; text-decoration:none }
		.nav-toggle {
			display: none;
			width: 42px;
			height: 42px;
			border-radius: 12px;
			border: 1px solid rgba(93, 155, 255, 0.35);
			background: rgba(20, 24, 28, 0.7);
			align-items: center;
			justify-content: center;
			gap: 5px;
			cursor: pointer;
			transition: border-color 0.3s, transform 0.3s;
		}
		.nav-toggle:hover { border-color: #5D9BFF; transform: translateY(-1px); }
		.nav-toggle span {
			display: block;
			width: 20px;
			height: 2px;
			background: #E0E4E9;
			border-radius: 2px;
			transition: transform 0.3s, opacity 0.3s;
		}
		.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
		.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
		.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
		.header-contacts { display:flex; align-items:center; gap:16px; }
		.phone-link { color:#FFFFFF; text-decoration:none; font-weight:600; font-size:16px; transition: color 0.3s; }
		.phone-link:hover { color:#5D9BFF; }
		.tg-link {
			display:flex;
			align-items:center;
			justify-content:center;
			width:40px;
			height:40px;
			background:#5D9BFF;
			border-radius:50%;
			transition: all 0.3s;
		}
		.tg-link:hover { background:#BD7AFF; transform: translateY(-2px); }
		.tg-link svg { width:20px; height:20px; fill:#0A0C0F; }
		.footer { padding: 40px 0; border-top:1px solid rgba(93,155,255,0.1); margin-top:40px }
		.footer .container { display:flex; justify-content:space-between; color:#6B7280 }
		.contacts { background: rgba(20,24,28,0.6); padding:30px; border-radius:12px; margin-top:30px }
		a.contact-link { color:#5D9BFF; text-decoration:none }

    <script>
        (function () {
            const toggle = document.querySelector('.nav-toggle');
            const nav = document.querySelector('.nav');
            const header = document.querySelector('.header');
            if (!toggle || !nav || !header) return;

            const closeNav = () => {
                nav.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
            };

            toggle.addEventListener('click', () => {
                const isOpen = nav.classList.toggle('open');
                toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', closeNav);
            });

            document.addEventListener('click', (event) => {
                if (!nav.classList.contains('open')) return;
                if (!header.contains(event.target)) {
                    closeNav();
                }
            });
        })();
    </script>
